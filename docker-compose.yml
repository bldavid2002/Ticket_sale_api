services:
  redis:
    image: redis:7-alpine
    container_name: ticket_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ticket_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: ticket_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ticketing
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: ticket_api 
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - redis
      - rabbitmq
      - postgres
    deploy:
      replicas: 3
    restart: unless-stopped

  worker:
    image: ticket_worker:latest
    build:
      context: ./worker
    container_name: ticket_worker
    depends_on:
      - rabbitmq
      - postgres
    restart: unless-stopped

  locust:
    image: locustio/locust
    container_name: ticket_locust
    ports:
      - "8089:8089"
    volumes:
      - ./load-testing:/mnt/locust
    command: -f /mnt/locust/load_tester.py
    depends_on:
      - api
    restart: unless-stopped
  
  nginx:
    image: nginx:alpine
    container_name: ticket_nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:

    