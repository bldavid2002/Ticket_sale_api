services:
  redis:
    image: redis:7-alpine
    container_name: ticket_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ticket_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: ticket_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ticketing
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: ticket_api 
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ticket_api
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - rabbitmq
      - postgres
    restart: unless-stopped

  worker:
    image: ticket_worker:latest
    build:
      context: ./worker
    container_name: ticket_worker
    depends_on:
      - rabbitmq
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:

    