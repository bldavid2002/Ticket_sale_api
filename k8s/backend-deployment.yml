apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-api
  labels:
    app: ticket-api
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: ticket-api
  template:
    metadata:
      labels:
        app: ticket-api
    spec:
      containers:
      - name: api
        image: ticket_api:latest
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672/"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-api-service
spec:
  selector:
    app: ticket-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP