apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      containers:
      - name: locust
        image: locustio/locust:latest
        ports:
        - containerPort: 8089
        args:
          - "-f"
          - "/mnt/locust/locustfile.py"
          - "--host=http://ticket-api-service"
        volumeMounts:
        - name: locust-script
          mountPath: /mnt/locust
      volumes:
      - name: locust-script
        configMap:
          name: locust-script-cm
---
apiVersion: v1
kind: Service
metadata:
  name: locust-service
spec:
  type: NodePort
  selector:
    app: locust
  ports:
  - port: 8089
    targetPort: 8089
    nodePort: 30089